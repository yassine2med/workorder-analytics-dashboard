[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workorder-analytics-dashboard"
version = "0.1.0"
description = "Aging, backlog and closure metrics for work order exports, with a Streamlit view"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "streamlit>=1.30"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
